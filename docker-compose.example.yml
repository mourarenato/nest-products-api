version: "3"
services:
  # node:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: nest-products-api
  #   tty: true
  #   restart: always
  #   volumes: 
  #     - .:/app
  #   working_dir: '/app'
  #   expose: 
  #     - "3000"
  #   networks:
  #     services:
  #       ipv4_address: 10.10.0.33

  postgres:
    image: postgres:11
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_DB=products_db
      - POSTGRES_USER=adm
      - POSTGRES_PASSWORD=123456
    volumes:
      - ./data/volumes/postgres:/var/lib/postgresql/data
      - ./data/dump:/var/lib/postgresql/dump
    networks:
      services:
        ipv4_address: 10.10.0.32

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/volumes/redis:/data
    networks:
      services:
        ipv4_address: 10.10.0.34

networks:
  services:
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/20
          

          